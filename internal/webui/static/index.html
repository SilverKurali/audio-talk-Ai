<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Talk AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div class="nav-brand"><span class="brand-dot"></span>Audio Talk AI</div>
  <div class="nav-links">
    <a href="#" class="nav-link active" data-page="config">配置</a>
    <a href="#" class="nav-link" data-page="history">历史</a>
  </div>
</nav>

<main>
  <!-- 配置页 -->
  <div id="page-config" class="page active">
    <div class="card">
      <h2 data-icon="voice">语音设置</h2>
      <div class="form-grid">
        <label>热键</label>
        <div>
          <select id="cfg-hotkey-preset" onchange="onHotkeyPresetChange()">
            <option value="F9">F9</option>
            <option value="F8">F8</option>
            <option value="Alt+Super">Alt+Super</option>
            <option value="Ctrl+Alt">Ctrl+Alt</option>
            <option value="Ctrl+Shift">Ctrl+Shift</option>
            <option value="Alt+F8">Alt+F8</option>
            <option value="Alt+F9">Alt+F9</option>
            <option value="Ctrl+Alt+Tab">Ctrl+Alt+Tab</option>
            <option value="Option+Command">Option+Command (macOS)</option>
            <option value="custom">自定义...</option>
          </select>
          <input type="text" id="cfg-push-to-talk" placeholder="输入自定义热键" style="display:none;margin-top:6px">
        </div>
        <label>模式</label>
        <select id="cfg-mode">
          <option value="toggle">toggle（按一下开始，再按停止）</option>
          <option value="hold">hold（按住说话）</option>
        </select>
        <label>自动上屏</label>
        <select id="cfg-auto-submit">
          <option value="true">开启</option>
          <option value="false">关闭</option>
        </select>
        <label>停止延迟 (ms)</label>
        <input type="number" id="cfg-stop-delay" min="0" max="5000">
        <label>热词</label>
        <input type="text" id="cfg-hotwords" placeholder="逗号分隔，如：项目名,人名,术语">
      </div>
      <button class="btn btn-primary" onclick="saveVoiceConfig()">保存语音设置</button>
    </div>

    <div class="card">
      <h2 data-icon="provider">ASR 服务商</h2>
      <div id="provider-list"></div>
      <button class="btn btn-secondary" onclick="showAddProvider()">+ 添加服务商</button>
    </div>

    <div class="card" id="add-provider-card" style="display:none">
      <h2>添加服务商</h2>
      <div class="form-grid">
        <label>类型</label>
        <select id="add-type" onchange="updateAddFields()">
          <option value="" disabled selected>加载中...</option>
        </select>
      </div>
      <div id="add-fields"></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="addProvider()">确认添加</button>
        <button class="btn btn-secondary" onclick="hideAddProvider()">取消</button>
      </div>
    </div>

    <div id="edit-provider-modal" class="modal" style="display:none">
      <div class="modal-content">
        <h2>编辑服务商: <span id="edit-provider-name"></span></h2>
        <div id="edit-fields"></div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="saveProvider()">保存</button>
          <button class="btn btn-secondary" onclick="hideEditProvider()">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 历史页 -->
  <div id="page-history" class="page">
    <div class="card">
      <h2 data-icon="stats">统计</h2>
      <div class="stats-bar">
        <span class="stat" data-icon="count"><em>历史次数</em><strong id="h-sessions">0</strong></span>
        <span class="stat" data-icon="chars"><em>总字数</em><strong id="h-chars">0</strong></span>
        <span class="stat" data-icon="time"><em id="h-duration-label">总时长 (s)</em><strong id="h-duration">0</strong></span>
      </div>
    </div>
    <div class="card">
      <h2 data-icon="history">转写记录</h2>
      <div class="history-toolbar">
        <div class="toolbar-left">
          <span class="select-hint" onclick="toggleSelectAll()">全选</span>
          <button class="btn btn-danger btn-small" onclick="deleteSelected()">删除选中</button>
        </div>
        <div class="toolbar-right">
          <span class="date-display" id="date-from-display" onclick="openDatePicker('from')">选择开始日期 ▼</span>
          <span>至</span>
          <span class="date-display" id="date-to-display" onclick="openDatePicker('to')">选择结束日期 ▼</span>
          <button class="btn btn-danger btn-small" onclick="deleteByDate()">删除日期范围</button>
          <button class="btn btn-secondary btn-small" onclick="exportHistory('txt')">导出 TXT</button>
          <button class="btn btn-secondary btn-small" onclick="exportHistory('json')">导出 JSON</button>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th><input type="checkbox" id="select-all-head" onclick="syncSelectAll(this.checked)"></th><th>时间</th><th>服务商</th><th>文本</th><th>时长</th><th>字数</th></tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="btn btn-secondary" id="prev-page" onclick="prevPage()" disabled>上一页</button>
        <span id="page-info"></span>
        <button class="btn btn-secondary" id="next-page" onclick="nextPage()" disabled>下一页</button>
      </div>
    </div>
  </div>
</main>

<div class="status-bar">
  <span id="recording-status">待机</span>
  <span id="status-detail"></span>
</div>

<script src="datepicker.js"></script>
<div id="date-picker-popup" class="date-picker-popup" style="display:none">
  <div class="dp-level" id="dp-years"></div>
  <div class="dp-level" id="dp-months" style="display:none"></div>
  <div class="dp-level" id="dp-days" style="display:none"></div>
</div>
<script src="app.js"></script>
</body>
</html>
