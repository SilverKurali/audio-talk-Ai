# Gitee Go CI — build and test on Linux.
# Note: Gitee Go only provides Linux runners, so the darwin cgo code is not
# compiled here. Use the GitHub Actions workflow (.github/workflows/ci.yml) for
# macOS build verification.
name: CI

on:
  push:
    branches: [master]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      - name: Build (no_x11)
        run: go build -tags no_x11 ./...
      - name: Vet
        run: go vet -tags no_x11 ./...
      - name: Test
        run: go test -tags no_x11 ./... -v