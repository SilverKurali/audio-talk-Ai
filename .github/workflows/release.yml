# Cross-platform release workflow.
# Triggered by pushing a v* tag (e.g. v1.0.0).
#
# Builds native binaries for:
#   - Linux amd64   (full cgo: X11 + Wayland evdev)
#   - Linux arm64   (full cgo: X11 + Wayland evdev, native arm64 runner)
#   - macOS amd64   (cgo: cross-compiled on Apple Silicon via GOARCH=amd64)
#   - macOS arm64   (cgo: Apple Silicon native)
#   - Windows amd64 (pure Go: Win32 via golang.org/x/sys)
#   - Windows arm64 (pure Go: Win32 via golang.org/x/sys)
#
# Each binary is packaged as a tar.gz (Linux/macOS) or zip (Windows) with
# config.toml.example and README, then uploaded to the GitHub Release.
# Gitee releases are published manually after syncing the tag.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            cgo: '1'
            goarch: amd64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            cgo: '1'
            goarch: arm64
          - os: darwin
            arch: amd64
            # Cross-compile on Apple Silicon runner (avoids Intel runner queue).
            runner: macos-latest
            cgo: '1'
            goarch: amd64
          - os: darwin
            arch: arm64
            runner: macos-latest
            cgo: '1'
            goarch: arm64
          - os: windows
            arch: amd64
            runner: windows-latest
            cgo: '0'
            goarch: amd64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            cgo: '0'
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install Linux dependencies (X11/Wayland dev)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxdo-dev \
            libxrender-dev libxext-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev

      - name: Verify Xcode (macOS)
        if: matrix.os == 'darwin'
        run: xcode-select -p

      - name: Set binary name
        id: name
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            echo "binary=audio-talk-ai.exe" >> $GITHUB_OUTPUT
          else
            echo "binary=audio-talk-ai" >> $GITHUB_OUTPUT
          fi

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o ${{ steps.name.outputs.binary }} \
            ./cmd/audio-talk-ai

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${VERSION#v}"
          ARCHIVE="audio-talk-ai-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$ARCHIVE" \
            ${{ steps.name.outputs.binary }} \
            config.toml.example \
            README.md
          echo "archive=$ARCHIVE" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${VERSION#v}"
          ARCHIVE="audio-talk-ai-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip"
          7z a "$ARCHIVE" \
            ${{ steps.name.outputs.binary }} \
            config.toml.example \
            README.md
          echo "archive=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: audio-talk-ai-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.archive }}
          retention-days: 7

  release-github:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: ${{ github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true